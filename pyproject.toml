[project]
name = "remoteevolver"
version = "0.1.0"
description = "Task execution, GitHub tool evolution, Skill learning and independent evaluation"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["pyyaml>=6", "openai>=1", "python-dotenv>=1", "mcp>=1", "fastmcp>=2,<4", "jsonschema>=4,<5"]
[project.scripts]
remoteevolver = "remoteevolver.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"remoteevolver.prompt" = ["*.txt"]
